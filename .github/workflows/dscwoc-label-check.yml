name: DSCWoC PR Label Check

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled]

jobs:
  check_dscwoc_labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Add dscwoc label if missing
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const labels = context.payload.pull_request.labels.map(l => l.name);

            // Add dscwoc label if not present
            if (!labels.includes('dscwoc')) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: ['dscwoc']
                });
                core.info('Added dscwoc label to PR');
              } catch (error) {
                core.warning(`Could not add dscwoc label: ${error.message}`);
              }
            }

            // Check for difficulty label
            const difficultyLabels = ['level-1', 'level-2', 'level-3'];
            const hasDifficulty = labels.some(l => difficultyLabels.includes(l));

            if (!hasDifficulty) {
              core.warning('⚠️ This PR is missing a difficulty label (level-1, level-2, or level-3). A mentor/admin must add one for scoring.');
            }
